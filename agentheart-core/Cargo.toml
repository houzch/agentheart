[package]
name = "agentheart-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AgentHeart 内核：轻量调度与消息处理心脏包（零第三方依赖，仅 std）"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# 内核运行时依赖：必须保持为空（零第三方依赖，仅 std）
# 测试/开发期依赖允许第三方，写在 [dev-dependencies]（不进入运行时）
